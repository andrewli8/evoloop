[project]
name = "evolveloop"
version = "0.1.2"
description = "Bounded, evidence-driven product improvement loop for any git repository"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "typer>=0.12",
  "pydantic>=2.6",
  "pyyaml>=6",
]

[project.scripts]
evoloop = "evoloop.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evoloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
