name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build

      # Wheel smoke: the packaged CLI must actually run (catches missing subpackages, broken entry points).
      - run: uvx --from ./dist/*.whl evoloop version

      # Dry run: workflow_dispatch on a branch builds but never cuts a release.
      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: dist/*
